services:
  bifrost:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bifrost
    restart: unless-stopped
    ports:
      - "${BIFROST_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATA_DIR: /data
      PANEL_DIST_DIR: /app/panel/dist
    volumes:
      - bifrost_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  bifrost_data:
